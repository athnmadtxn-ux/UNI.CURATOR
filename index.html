<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="frame">
    <div class="name">
    <header><span style="color:skyblue; font-family: 'Courier New', Courier, monospace; font-weight: bold;">UNI</span><span style="color:whitesmoke; font-weight: bold;">.</span><span style="color:blanchedalmond; font-family: 'Courier New', Courier, monospace;">CURATOR</span></header>
    </div>
    <div class="contain">
        <div class="row">
            <input id="input" type="text"/> 
        </div>
        <div class="row">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn">/</button>
        </div>
        <div class="row">
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn">*</button>
        </div>
        <div class="row">
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">+</button>
        </div>
        <div class="row">
            <button class="btn">0</button>
            <button class="btn">C</button>
            <button class="btn" style="font-weight: bolder">-</button>
            <button class="btn">=</button>
        </div>
            <div class="row">
            <button class="btn">%</button>
            <img class="img1"src="koya1.png">
            <img class="img1" src="Cherry.png">
            <img class="img1" src="Yoonrine.png">
            <img class="img1" src="koya3.png">
            <button id="lastbtn" style="font-weight: bolder">.</button>
            
        </div>
    </div>
    </div>
    <script src="Script.JS"></script>
</body>
</html>
